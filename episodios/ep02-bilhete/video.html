<canvas id="c" width="1080" height="1920"></canvas>
<script>
const W = 1080, H = 1920;
const cv = document.getElementById('c');
let ctx = cv.getContext('2d');
const INK = '#26222f'; const LW = 7;
</script>
<script src="common.js"></script>
<script src="bgs.js"></script>
<script>
const Y = '#ffcc29';
const LUQ = { luq: true };
const SENHORA = { kind: 'adult', skin: '#f0c9a4', shirt: '#c77dba', pants: '#f0c9a4', shoes: '#7a4a6a', hair: 'bun', hairColor: '#cfcfd8', dress: true, glasses: true };
const PADEIRO = { kind: 'adult', skin: '#e2a678', shirt: '#ffffff', pants: '#5a5f78', shoes: '#3a2a22', hair: 'short', hairColor: '#4a3020', chef: true, mustache: true };
const HOMEM = { kind: 'adult', skin: '#c98b5e', shirt: '#3a8fd6', pants: '#3f4560', shoes: '#2a2a30', hair: 'short', hairColor: '#2a1c16', mustache: true };
const AMIGO = { kind: 'adult', skin: '#efc39c', shirt: '#e8774f', pants: '#5a4a7a', shoes: '#2a2a30', hair: 'bald', hairColor: '#8a7a70' };
const PROF = { kind: 'adult', skin: '#f2cfae', shirt: '#8e6cc9', pants: '#f2cfae', shoes: '#4a3a6a', hair: 'bun', hairColor: '#ececf2', dress: true, glasses: true };

// ---------- script ----------
const RAW = [
  ['achado', 'Encontrei um bilhete preso numa foto antiga:'],
  ['achado', '“Devolva para quem perdeu.”'],
  ['achado', 'Só tinha um problema:'],
  ['achado', 'ninguém dizia ter perdido aquela foto.'],
  ['senhora', 'Uma senhora reconheceu a praça.'],
  ['padaria', 'O padeiro reconheceu as pessoas.'],
  ['homem', 'E um homem reconheceu o menino que aparecia no canto.'],
  ['caminho', 'Ele era o melhor amigo dele quando criança.'],
  ['caminho', 'Os dois não se falavam havia tantos anos'],
  ['caminho', 'que nem lembravam por que tinham brigado.'],
  ['reencontro', 'No verso da foto, tinha mais uma frase:'],
  ['reencontro', '“Às vezes, a gente não perde as coisas.'],
  ['reencontro', 'Perde as pessoas da lembrança.”'],
  ['professora', 'Procurei quem escreveu o bilhete.'],
  ['professora', 'Era a antiga professora da cidade.'],
  ['professora', 'Ela só queria que aqueles amigos se encontrassem de novo.'],
];
const PRE_GAP = { achado: 2.2, reencontro: 1.9 }; // silent time before the first line of a scene
const LINES = []; const SCENES = [];
(function build() {
  let t = 0, prev = null;
  for (const [sc, text] of RAW) {
    if (sc !== prev) {
      const gap = PRE_GAP[sc] !== undefined ? PRE_GAP[sc] : 0.55;
      SCENES.push({ name: sc, start: t }); t += gap; prev = sc;
    }
    const words = text.split(' ').length;
    const dur = clamp(words * 0.36 + 0.6, 1.8, 4.4);
    LINES.push([t, t + dur, sc, text]); t += dur;
  }
  window.DUR = t + 2.0;
  SCENES.forEach((s, i) => s.end = i < SCENES.length - 1 ? SCENES[i + 1].start : window.DUR + 1);
})();
const L = i => LINES[i][0];
const LE = i => LINES[i][1];
const sceneAt = t => SCENES.find(s => t >= s.start && t < s.end) || SCENES[SCENES.length - 1];
function activeLine(t) { return LINES.find(l => t >= l[0] && t < l[1]); }
function speakEnd(l) { return l[0] + Math.min(l[1] - l[0] - 0.25, l[3].split(' ').length * 0.32 + 0.3); }
const blinkAt = (t, seed) => (t + seed * 1.37) % 3.3 < 0.12;
const bob = (t, k = 1) => Math.sin(t * 2 + k) * 3;

// ---------- sound effects timeline (read by the renderer) ----------
const SFX = [];
function sfx(t, type, vol = 1) { SFX.push({ t: +t.toFixed(3), type, vol }); }

// ---------- helpers ----------
function popText(txt, x, y, size, color, k, rot = 0) {
  if (k <= 0) return;
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); const s = easeBack(k); ctx.scale(s, s);
  ctx.font = `700 ${size}px Fredoka`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineWidth = size * 0.22; ctx.strokeStyle = INK; ctx.lineJoin = 'round'; ctx.strokeText(txt, 0, 4);
  ctx.fillStyle = color; ctx.fillText(txt, 0, 0); ctx.restore();
}
function heart(x, y, s, a) {
  ctx.save(); ctx.globalAlpha = clamp(a, 0, 1); ctx.translate(x, y); ctx.scale(s, s);
  shape('#ff5a7a', () => { ctx.moveTo(0, 30); ctx.bezierCurveTo(-60, -10, -30, -60, 0, -30); ctx.bezierCurveTo(30, -60, 60, -10, 0, 30); }, 6);
  ctx.restore();
}
// world position of Lucas's right fist (same transforms as drawLuq)
function luqHand(p) {
  const sc = (p.s || 1) * 0.41, ang = p.armR || 0, side = 1;
  const m = new DOMMatrix().translateSelf(p.x, p.y).scaleSelf(sc * (p.flip ? -1 : 1), sc).translateSelf(-520, -1440)
    .translateSelf(520 + side * 150, 712).scaleSelf(side, 1).scaleSelf(-1, 1)
    .rotateSelf(ang * 0.3 * 180 / Math.PI).translateSelf(-66, 126).rotateSelf(ang * 0.7 * 180 / Math.PI);
  const q = m.transformPoint(new DOMPoint(4, 174)); return [q.x, q.y];
}
function envelope(x, y, s, rot = 0, open = false) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s);
  if (open) shape('#eadbb8', poly([-60, -38, 0, -86, 60, -38]), 5);
  shape('#f5e8c9', rr(-60, -38, 120, 78, 6), 5);
  shape(null, () => { ctx.moveTo(-60, -38); ctx.lineTo(0, 8); ctx.lineTo(60, -38); }, 4);
  if (!open) { shape('#d9534f', ell(0, 6, 9, 9), 3); }
  ctx.restore();
}
function smallPhoto(x, y, s, rot = 0) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s);
  shape('#fbf6ea', rr(-52, -40, 104, 80, 4), 5);
  ctx.fillStyle = '#c9ab7c'; ctx.fillRect(-44, -32, 88, 56);
  ctx.fillStyle = '#9c7d54'; ctx.fillRect(-44, 8, 88, 16);
  ctx.restore();
}
// big close-up of the photo (front) or its back
function drawPhotoCard(k, opts) {
  if (k <= 0) return;
  ctx.save();
  ctx.fillStyle = `rgba(20,16,30,${0.45 * clamp(k * 1.5, 0, 1)})`; ctx.fillRect(0, 0, W, H);
  ctx.translate(540, 760); const s = easeBack(k); ctx.scale(s, s); ctx.rotate(-0.04);
  const w = 820, h = 600;
  if (!opts.back) {
    shape('#fbf6ea', rr(-w / 2, -h / 2, w, h, 10), 9);
    ctx.save(); ctx.beginPath(); ctx.rect(-w / 2 + 36, -h / 2 + 36, w - 72, h - 110); ctx.clip();
    ctx.filter = 'sepia(0.95) saturate(0.9)';
    ctx.translate(-w / 2 + 36, -h / 2 + 36);
    const iw = w - 72, ih = h - 110;
    ctx.fillStyle = '#bfe0f2'; ctx.fillRect(0, 0, iw, ih);
    ctx.fillStyle = '#7fbf6a'; ctx.beginPath(); ctx.ellipse(110, 150, 110, 100, 0, 0, 7); ctx.ellipse(640, 140, 120, 100, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#8d5a3b'; ctx.fillRect(100, 200, 22, 110); ctx.fillRect(630, 200, 22, 110);
    ctx.fillStyle = '#d9cbb0'; ctx.fillRect(0, 300, iw, ih - 300);
    shape('#cfd9e2', ell(380, 330, 120, 30), 5); shape('#9fc7e6', ell(380, 322, 96, 20), 0); shape('#cfd9e2', rr(366, 250, 28, 70, 6), 5);
    person({ kind: 'adult', x: 230, y: 440, s: 0.34, skin: '#e9b48c', shirt: '#e86f4f', pants: '#444', shoes: '#333', hair: 'short', hairColor: '#4a3020', expr: 'grin' });
    person({ kind: 'adult', x: 520, y: 440, s: 0.34, skin: '#f0c9a4', shirt: '#7cc4b8', pants: '#f0c9a4', shoes: '#555', hair: 'bun', hairColor: '#6b3b22', dress: true, expr: 'grin' });
    person({ kind: 'kid', x: 680, y: 445, s: 0.34, skin: '#efc39c', shirt: '#e8774f', sleeve: '#e8774f', pants: '#3a5fa8', shoes: '#fff', hair: 'short', hairColor: '#3a2a20', expr: 'grin' });
    ctx.filter = 'none';
    ctx.restore();
    if (opts.highlight > 0) {
      const hk = clamp(opts.highlight, 0, 1);
      ctx.strokeStyle = '#ff4d5e'; ctx.lineWidth = 10; ctx.setLineDash([22, 14]);
      ctx.beginPath(); ctx.arc(-w / 2 + 36 + 680, -h / 2 + 36 + 345, 115 * easeBack(hk), 0, 7); ctx.stroke(); ctx.setLineDash([]);
    }
    if (opts.note > 0) {
      ctx.save(); ctx.translate(20, 262); ctx.rotate(0.04); const nk = easeBack(clamp(opts.note, 0, 1)); ctx.scale(nk, nk);
      shape('#fff8c8', rr(-360, -62, 720, 124, 6), 7);
      ctx.font = '600 52px Fredoka'; ctx.fillStyle = '#5a3a20'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('Devolva para quem perdeu', 0, 4);
      shape('#b9bcc6', rr(-320, -86, 26, 70, 13), 5);
      ctx.restore();
    }
  } else {
    shape('#efe2c4', rr(-w / 2, -h / 2, w, h, 10), 9);
    ctx.strokeStyle = 'rgba(140,110,70,0.25)'; ctx.lineWidth = 4;
    for (let yy = -h / 2 + 90; yy < h / 2 - 40; yy += 70) { ctx.beginPath(); ctx.moveTo(-w / 2 + 50, yy); ctx.lineTo(w / 2 - 50, yy); ctx.stroke(); }
    ctx.font = '600 60px Fredoka'; ctx.fillStyle = '#4a3020'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const lines = ['“Às vezes, a gente', 'não perde as coisas.', 'Perde as pessoas', 'da lembrança.”'];
    const n = Math.floor(clamp(opts.write, 0, 1) * 4 + 0.999);
    lines.slice(0, n).forEach((tx, i) => ctx.fillText(tx, 0, -165 + i * 110));
  }
  ctx.restore();
}

// ---------- backgrounds ----------
function tree(x, y, s) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  shape('#8d5a3b', rr(-26, -260, 52, 260, 10));
  shape('#5fbf62', () => { ctx.ellipse(0, -330, 150, 130, 0, 0, 7); });
  shape('#5fbf62', () => { ctx.ellipse(-110, -270, 90, 80, 0, 0, 7); });
  shape('#5fbf62', () => { ctx.ellipse(110, -270, 90, 80, 0, 0, 7); });
  ctx.fillStyle = '#5fbf62'; ctx.beginPath(); ctx.ellipse(0, -290, 150, 80, 0, 0, 7); ctx.fill();
  ctx.restore();
}
function bench(x, y) {
  shape('#8d5a3b', rr(x - 150, y - 130, 300, 24, 6));
  shape('#8d5a3b', rr(x - 150, y - 96, 300, 24, 6));
  shape('#a8683c', rr(x - 160, y - 58, 320, 28, 6));
  shape('#5a5f6a', rr(x - 130, y - 30, 18, 60, 4)); shape('#5a5f6a', rr(x + 112, y - 30, 18, 60, 4));
}
function bgPraca(t, variant = 0) {
  const g = ctx.createLinearGradient(0, 0, 0, 1150); g.addColorStop(0, '#8fcaf2'); g.addColorStop(1, '#dff0fb');
  ctx.fillStyle = g; ctx.fillRect(-300, -300, W + 600, H + 600);
  cloud(200 + (t * 8) % 1400 - 200, 250, 1.0); cloud(900 - (t * 5) % 1300 + 200, 380, 0.8);
  // far buildings
  const bl = [['#f3c94a', 0, 760, 200], ['#ff8a7a', 210, 700, 170], ['#7cc4b8', 390, 790, 220], ['#c9a7ef', 620, 720, 190], ['#f5f0e1', 820, 770, 260]];
  for (const [c, x, y, w] of bl) { shape(c, rr(x, y, w, 1150 - y, 0)); for (let yy = y + 40; yy < 1080; yy += 90) for (let xx = x + 30; xx < x + w - 40; xx += 70) shape('#ffffff', rr(xx, yy, 36, 46, 4), 4); }
  ctx.fillStyle = '#7fcf73'; ctx.fillRect(-300, 1060, W + 600, 90); shape(null, () => { ctx.moveTo(-300, 1060); ctx.lineTo(W + 300, 1060); });
  shape('#e3d6bb', rr(-300, 1150, W + 600, 900, 0));
  ctx.strokeStyle = 'rgba(0,0,0,0.07)'; ctx.lineWidth = 5; for (let x = -300; x < W + 300; x += 120) { ctx.beginPath(); ctx.moveTo(x, 1150); ctx.lineTo(x - 90, 1920); ctx.stroke(); }
  for (let y = 1230; y < 1920; y += 90) { ctx.beginPath(); ctx.moveTo(-300, y); ctx.lineTo(W + 300, y); ctx.stroke(); }
  shape(null, () => { ctx.moveTo(-300, 1150); ctx.lineTo(W + 300, 1150); });
  tree(90, 1150, 1.05); tree(1010, 1150, 1.0);
  // lamp
  shape('#4a4f60', rr(variant ? 180 : 880, 760, 16, 400, 6)); shape('#fff1a8', ell(variant ? 188 : 888, 750, 30, 30), 6);
}
function bgPadaria(t) {
  ctx.fillStyle = '#f6e3c4'; ctx.fillRect(-300, -300, W + 600, H + 600);
  ctx.strokeStyle = 'rgba(0,0,0,0.05)'; ctx.lineWidth = 4; for (let y = 0; y < 1150; y += 60) { ctx.beginPath(); ctx.moveTo(-300, y); ctx.lineTo(W + 300, y); ctx.stroke(); }
  shape('#8d5a3b', rr(200, 220, 680, 150, 20));
  ctx.font = '700 100px Fredoka'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#fff4d6'; ctx.fillText('PADARIA', 540, 300);
  // awning
  for (let i = 0; i < 9; i++) shape(i % 2 ? '#ffffff' : '#e2453c', poly([60 + i * 106, 420, 166 + i * 106, 420, 166 + i * 106, 520, 60 + i * 106, 520]), 5);
  for (let i = 0; i < 9; i++) shape(i % 2 ? '#ffffff' : '#e2453c', () => { ctx.arc(113 + i * 106, 520, 53, 0, Math.PI); }, 5);
  // window with breads
  shape('#bfe6ff', rr(120, 640, 520, 380, 12), 8);
  shape('#d9b98a', rr(140, 900, 480, 30, 4), 5);
  for (const [bx, by, rx, ry] of [[220, 870, 70, 34], [360, 860, 80, 42], [510, 872, 66, 30], [290, 800, 60, 28], [450, 805, 64, 30]]) {
    shape('#e0a050', ell(bx, by, rx, ry), 5); ctx.strokeStyle = '#a86a28'; ctx.lineWidth = 5; for (let i = -1; i <= 1; i++) { ctx.beginPath(); ctx.moveTo(bx + i * rx * 0.4 - 8, by - ry * 0.5); ctx.lineTo(bx + i * rx * 0.4 + 8, by + ry * 0.4); ctx.stroke(); }
  }
  shape('#8d5a3b', rr(720, 640, 240, 510, 10)); shape('#bfe6ff', rr(760, 690, 160, 200, 8), 6); shape(Y, ell(930, 920, 12, 12), 5);
  shape('#d9cbb0', rr(-300, 1150, W + 600, 900, 0)); shape(null, () => { ctx.moveTo(-300, 1150); ctx.lineTo(W + 300, 1150); });
}

// ---------- scenes ----------
function sAchado(t, sc) {
  bgPraca(t);
  bench(700, 1250);
  const walkEnd = 1.5, pick = 1.75;
  const walking = t < walkEnd;
  const lx = lerp(-120, 420, ease(t / walkEnd));
  const holding = t >= pick;
  const cardIn = L(0) + 0.5, cardOut = L(2) - 0.1;
  const confused = t > L(2);
  const armR = !holding ? (t > walkEnd ? lerp(0, 1.1, clamp((t - walkEnd) / 0.25, 0, 1)) : 0) : 1.0;
  const p = { ...LUQ, x: lx, y: 1300 + (walking ? -Math.abs(Math.sin(t * 9)) * 14 : bob(t)), s: 1, expr: confused ? 'shock' : 'grin', look: confused ? Math.sign(Math.sin((t - L(2)) * 2.2)) : 1, blink: blinkAt(t, 1), armR: confused ? 0.9 : armR, armL: confused ? 0.9 : 0 };
  person(p);
  if (!holding) envelope(700, 1180, 0.8, 0.08);
  else if (!confused) { const [hx, hy] = luqHand(p); envelope(hx + 10, hy - 30, 0.75, -0.15, t > pick + 0.3); smallPhoto(hx + 20, hy - 70, 0.7, 0.12); }
  else { const [hx, hy] = luqHand(p); smallPhoto(hx + 10, hy - 40, 0.75, 0.1); }
  if (confused) { popText('?', 380, 520, 150, '#ffffff', (t - L(2) - 0.1) / 0.25, -0.15); popText('?', 520, 470, 100, Y, (t - L(3)) / 0.25, 0.2); }
  if (t > cardIn - 0.01) drawPhotoCard(t < cardOut ? (t - cardIn) / 0.35 : 1 - (t - cardOut) / 0.25, { note: (t - cardIn - 0.5) / 0.3 });
}
function showScene(t, sc, bgFn, other, otherProps, reactAt, react) {
  bgFn(t);
  const p = { ...LUQ, x: 330, y: 1300 + bob(t), s: 1, expr: 'grin', look: 1, blink: blinkAt(t, 1), armR: 1.15 };
  const k = clamp((t - sc.start) / 0.4, 0, 1);
  p.x = lerp(200, 330, ease(k));
  const reacted = t > reactAt;
  person({ ...other, x: 780, y: 1300 + bob(t, 2), s: 0.95, look: -1, blink: blinkAt(t, 3), flip: true, expr: reacted ? react : null, armR: reacted ? 2.5 : 0.1, armL: 0.1, ...otherProps(t) });
  person(p);
  const [hx, hy] = luqHand(p); smallPhoto(hx + 14, hy - 40, 0.8, 0.1);
  if (reacted) popText('!', 860, 470, 150, Y, (t - reactAt) / 0.25, 0.15);
}
function sSenhora(t, sc) { showScene(t, sc, tt => bgStreet(tt + 30), SENHORA, () => ({}), L(4) + 1.1, 'grin'); }
function sPadaria(t, sc) { showScene(t, sc, bgPadaria, PADEIRO, () => ({}), L(5) + 1.1, 'grin'); }
function sHomem(t, sc) {
  showScene(t, sc, tt => bgStreet(tt + 80), HOMEM, () => ({}), L(6) + 1.0, 'shock');
  const cin = L(6) + 1.7;
  if (t > cin) drawPhotoCard((t - cin) / 0.35, { highlight: (t - cin - 0.45) / 0.35 });
}
function sCaminho(t, sc) {
  bgPraca(t, 1);
  bench(820, 1250);
  const k = clamp((t - sc.start) / 1.8, 0, 1), walking = k < 1;
  const sad = t > L(8);
  person({ ...AMIGO, x: 860, y: 1290 + bob(t, 4), s: 0.9, look: 0, expr: 'sad', blink: blinkAt(t, 5), flip: true, tilt: 0.06 });
  person({ ...HOMEM, x: lerp(-100, 470, ease(k)), y: 1300 + (walking ? -Math.abs(Math.sin(t * 8)) * 12 : bob(t, 2)), s: 0.95, look: sad ? 1 : 0, expr: sad ? 'sad' : null, blink: blinkAt(t, 3), tilt: sad ? 0.08 : 0 });
  person({ ...LUQ, x: lerp(-260, 250, ease(k)), y: 1310 + (walking ? -Math.abs(Math.sin(t * 9)) * 14 : bob(t)), s: 1, expr: sad ? 'sad' : 'grin', look: 1, blink: blinkAt(t, 1) });
  if (t > L(9)) popText('...', 860, 470, 110, '#ffffff', (t - L(9)) / 0.25);
}
function sReencontro(t, sc) {
  bgPraca(t, 1);
  bench(820, 1250);
  const meet = clamp((t - sc.start) / 1.1, 0, 1);
  const hug = t > sc.start + 1.0;
  person({ ...AMIGO, x: lerp(860, 640, ease(meet)), y: 1290 + bob(t, 4), s: 0.9, flip: true, look: -1, expr: hug ? 'grin' : 'shock', blink: hug ? true : blinkAt(t, 5), armL: hug ? 1.7 : 0, armR: hug ? 1.7 : 0 });
  person({ ...HOMEM, x: lerp(470, 470, ease(meet)), y: 1300 + bob(t, 2), s: 0.95, look: 1, expr: hug ? 'grin' : 'shock', blink: hug ? true : blinkAt(t, 3), armL: hug ? 1.7 : 0, armR: hug ? 1.7 : 0 });
  const p = { ...LUQ, x: 200, y: 1310 + bob(t), s: 1, expr: 'grin', look: 1, blink: blinkAt(t, 1), armR: 1.1 };
  person(p);
  const [hx, hy] = luqHand(p); smallPhoto(hx + 14, hy - 40, 0.8, 0.1);
  if (hug) for (let i = 0; i < 5; i++) { const ph = ((t - sc.start - 1.0) * 0.6 + i * 0.2) % 1; heart(560 + Math.sin(i * 2.1 + t * 2) * 140, 820 - ph * 360, 0.8 + i * 0.08, 1 - ph); }
  const cin = L(10) + 0.25;
  if (t > cin) drawPhotoCard((t - cin) / 0.35, { back: true, write: (t - L(11)) / (LE(12) - L(11) - 0.4) + 0.26 });
}
function sProfessora(t, sc) {
  bgPraca(t);
  const enter = clamp((t - L(14) - 0.2) / 1.0, 0, 1);
  // the two friends together in the background
  person({ ...HOMEM, x: 120, y: 1230, s: 0.62, look: 1, expr: 'grin', blink: blinkAt(t, 3) });
  person({ ...AMIGO, x: 240, y: 1225, s: 0.6, flip: true, look: -1, expr: 'grin', blink: blinkAt(t, 5) });
  const waving = t > L(15);
  person({ ...PROF, x: lerp(1180, 790, ease(enter)), y: 1300 + bob(t, 6), s: 0.95, flip: true, look: -1, expr: 'grin', blink: blinkAt(t, 7), armR: waving ? 2.2 + Math.sin(t * 8) * 0.25 : 0.1 });
  tree(1010, 1150, 1.0);
  const p = { ...LUQ, x: 420, y: 1310 + bob(t), s: 1, expr: t > L(14) + 0.6 ? 'shock' : 'grin', look: t > L(14) ? 1 : 0, blink: blinkAt(t, 1), armR: 1.25 };
  if (t > L(15) + 0.5) p.expr = 'grin';
  person(p);
  const [hx, hy] = luqHand(p);
  const shake = t < L(14) ? Math.sin(t * 22) * 0.2 * (t > L(13) + 0.3 ? 1 : 0) : 0;
  envelope(hx + 12, hy - 36, 0.85, -0.2 + shake, true);
  if (t > L(13) + 0.4 && t < L(14)) popText('vazio', hx + 20, hy - 170, 70, '#ffffff', (t - L(13) - 0.4) / 0.25, -0.08);
  if (t > L(14) + 0.6) popText('!', 560, 470, 140, Y, (t - L(14) - 0.6) / 0.25, -0.12);
  if (waving) for (let i = 0; i < 6; i++) { const ph = ((t - L(15)) * 0.5 + i * 0.17) % 1; heart(180 + i * 140 + Math.sin(i * 2.3 + t * 2) * 50, 900 - ph * 420, 0.6 + (i % 3) * 0.12, 1 - ph); }
}
const FN = { achado: sAchado, senhora: sSenhora, padaria: sPadaria, homem: sHomem, caminho: sCaminho, reencontro: sReencontro, professora: sProfessora };

// ---------- sfx plan ----------
(function plan() {
  const S = n => SCENES.find(s => s.name === n);
  for (let i = 1; i < SCENES.length; i++) sfx(SCENES[i].start, 'whoosh', 0.55);
  for (let t = 0.15; t < 1.5; t += 0.34) sfx(t, 'step', 0.5);
  sfx(0.6, 'bird', 0.35); sfx(1.75, 'paper', 0.8); sfx(2.05, 'paper', 0.6);
  sfx(L(0) + 0.5, 'pop', 0.6); sfx(L(0) + 1.0, 'paper', 0.6); sfx(L(2) - 0.1, 'whoosh', 0.35);
  sfx(L(2) + 0.1, 'boing', 0.5); sfx(L(3), 'boing', 0.4);
  sfx(S('senhora').start + 0.3, 'bird', 0.3); sfx(L(4) + 1.1, 'ding', 0.75);
  sfx(S('padaria').start + 0.15, 'shopbell', 0.7); sfx(L(5) + 1.1, 'ding', 0.75);
  sfx(L(6) + 1.0, 'ding', 0.8); sfx(L(6) + 1.7, 'pop', 0.6); sfx(L(6) + 2.15, 'sparkle', 0.7);
  for (let t = S('caminho').start + 0.1; t < S('caminho').start + 1.8; t += 0.36) sfx(t, 'step', 0.45);
  sfx(S('caminho').start + 0.8, 'bird', 0.25); sfx(L(9), 'sad', 0.6);
  sfx(S('reencontro').start + 1.0, 'warm', 0.7); sfx(L(10) + 0.2, 'paper', 0.7); sfx(L(10) + 0.25, 'pop', 0.5); sfx(L(11) + 0.2, 'sparkle', 0.5);
  sfx(L(13) + 0.3, 'paper', 0.6); sfx(L(13) + 0.6, 'paper', 0.4); sfx(L(14) + 0.6, 'ding', 0.75); sfx(L(14) + 0.7, 'sparkle', 0.55);
  sfx(L(15), 'musicbox', 0.7);
})();
window.SFX = SFX;

// ---------- subtitles (no speaker names) ----------
function drawSubs(t) {
  const l = activeLine(t); if (!l) return;
  const words = l[3].split(' ');
  const per = (speakEnd(l) - l[0]) / words.length;
  const nShown = Math.min(words.length, Math.floor((t - l[0]) / per) + 1);
  const fs = 84;
  ctx.font = `700 ${fs}px Fredoka`; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  const maxW = 860, space = ctx.measureText(' ').width;
  const rows = [[]]; let rw = 0;
  words.forEach((w, i) => { const ww = ctx.measureText(w).width; if (rw + ww > maxW && rows[rows.length - 1].length) { rows.push([]); rw = 0; } rows[rows.length - 1].push([w, ww, i]); rw += ww + space; });
  const lineH = fs * 1.12; const baseY = 1450 - (rows.length - 1) * lineH / 2;
  rows.forEach((row, ri) => {
    const total = row.reduce((a, r) => a + r[1], 0) + space * (row.length - 1);
    let x = 540 - total / 2; const y = baseY + ri * lineH;
    for (const [w, ww, i] of row) {
      if (i < nShown) {
        const k = easeBack((t - l[0] - i * per) / 0.18);
        ctx.save(); ctx.translate(x + ww / 2, y); ctx.scale(k, k);
        ctx.lineWidth = 20; ctx.strokeStyle = INK; ctx.lineJoin = 'round'; ctx.strokeText(w, -ww / 2, 4);
        ctx.fillStyle = i === nShown - 1 ? Y : '#ffffff'; ctx.fillText(w, -ww / 2, 0); ctx.restore();
      }
      x += ww + space;
    }
  });
}

function render(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  const sc = sceneAt(t); const local = t - sc.start;
  let z = 1.08 + local * 0.006; if (local < 0.35) z *= 1 + 0.1 * (1 - easeBack(local / 0.35));
  ctx.save(); ctx.translate(W / 2, H / 2); ctx.scale(z, z); ctx.translate(-540, -1010);
  FN[sc.name](t, sc);
  ctx.restore();
  if (local < 0.22 && sc.start > 0) { ctx.fillStyle = `rgba(255,255,255,${1 - local / 0.22})`; ctx.fillRect(0, 0, W, H); }
  if (t < 3.4) {
    const k = clamp((t - 0.1) / 0.3, 0, 1); const out = t > 3.1 ? 1 - (t - 3.1) / 0.3 : 1;
    ctx.save(); ctx.globalAlpha = out;
    shape('#1d4f91', rr(90, 230, 900, 250, 40), 8);
    popText('O BILHETE QUE', 540, 305, 78, '#ffffff', k);
    popText('NINGUÉM PERDEU', 540, 405, 90, Y, k);
    ctx.restore();
  }
  drawSubs(t);
}
window.render = render;
window.ready = document.fonts.load('700 92px Fredoka').then(() => document.fonts.load('600 52px Fredoka')).then(() => { render(0); return true; });
window.frame = t => { render(t); return cv.toDataURL('image/jpeg', 0.92); };
</script>
