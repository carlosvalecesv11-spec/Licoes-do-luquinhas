<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/f.css">
</head><body>
<script>let ctx; const INK = '#26222f'; const LW = 7;</script>
<script src="common.js"></script>
<script>
// YouTube banner: 2560x1440, safe area (all devices) 1546x423 centered
const P = { yellow: '#ffcc29', sky: '#3aa0ef', deep: '#1d4f91', orange: '#ff6b3d' };
const LUQ = { luq: true };
function rays(cx, cy, w, h, c1, c2, n) {
  const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(w, h) * 0.8); g.addColorStop(0, c1); g.addColorStop(1, c2);
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = 'rgba(255,255,255,0.09)';
  for (let i = 0; i < n; i++) { const a = i * Math.PI * 2 / n; ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, 4000, a, a + Math.PI / n); ctx.closePath(); ctx.fill(); }
}
function txt(t, x, y, size, fill, rot = 0, sw = 0.22) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  ctx.font = `700 ${size}px Fredoka`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if (sw) { ctx.lineWidth = size * sw; ctx.strokeStyle = INK; ctx.lineJoin = 'round'; ctx.strokeText(t, 0, size * 0.05); }
  ctx.fillStyle = fill; ctx.fillText(t, 0, 0); ctx.restore();
}
function star(x, y, r, fill, rot = 0) {
  shape(fill, () => { for (let i = 0; i <= 10; i++) { const a = i * Math.PI / 5 - Math.PI / 2 + rot; const rr2 = i % 2 ? r * 0.48 : r; const px = x + Math.cos(a) * rr2, py = y + Math.sin(a) * rr2; i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); } ctx.closePath(); }, 9);
}
function cloud(x, y, s) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.fillStyle = 'rgba(255,255,255,0.92)';
  ctx.beginPath(); ctx.ellipse(0, 0, 70, 40, 0, 0, 7); ctx.ellipse(-60, 14, 50, 30, 0, 0, 7); ctx.ellipse(60, 14, 55, 30, 0, 0, 7); ctx.ellipse(10, -26, 46, 36, 0, 0, 7); ctx.fill(); ctx.restore();
}
function draw(showSafe) {
  const c = document.createElement('canvas'); c.width = 2560; c.height = 1440; document.body.appendChild(c); ctx = c.getContext('2d');
  const g = ctx.createLinearGradient(0, 0, 0, 1440); g.addColorStop(0, '#8fd0ff'); g.addColorStop(1, '#dff3ff');
  ctx.fillStyle = g; ctx.fillRect(0, 0, 2560, 1440);
  const cream = (x, y, s) => { ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.fillStyle = '#fff3dc'; for (const [ex, ey, rx, ry] of [[0, 0, 80, 46], [-70, 18, 58, 34], [72, 18, 62, 34], [12, -32, 54, 42]]) { ctx.beginPath(); ctx.ellipse(ex, ey, rx, ry, 0, 0, 7); ctx.fill(); } ctx.restore(); };
  cream(330, 260, 1.9); cream(1300, 330, 1.4); cream(2300, 250, 1.5); cream(560, 1000, 1.0); cream(140, 760, 0.9);
  // soft bushes
  ctx.fillStyle = '#a8dfae';
  for (let i = -1; i < 16; i++) { ctx.beginPath(); ctx.ellipse(i * 180, 1300 + (i % 2) * 40, 170, 150, 0, 0, 7); ctx.fill(); }
  ctx.fillRect(0, 1300, 2560, 200);
  // Lucas (thumbs up) then the dog in front of his shoulder
  person({ ...LUQ, x: 1760, y: 1440, s: 1.65, expr: 'grin', armR: 2.5, thumbR: true });
  drawPin({ x: 1190, y: 1262, s: 1.5, tilt: -0.05 });
  // title
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '700 118px Fredoka'; ctx.lineWidth = 26; ctx.strokeStyle = '#ffffff'; ctx.lineJoin = 'round';
  ctx.strokeText('Lições do', 900, 712); ctx.fillStyle = '#1565c0'; ctx.fillText('Lições do', 900, 712);
  ctx.font = '700 200px Fredoka';
  ctx.strokeText('Lucas', 900, 838); ctx.fillText('Lucas', 900, 838);
  if (showSafe) { ctx.strokeStyle = 'rgba(255,0,0,0.9)'; ctx.lineWidth = 6; ctx.setLineDash([20, 14]); ctx.strokeRect(507, 508, 1546, 423); ctx.setLineDash([]); }
  return c.toDataURL('image/png');
}
window.exportAll = () => ({ banner_youtube: draw(false), banner_preview_safe: draw(true) });
window.ready = document.fonts.load('700 92px Fredoka').then(() => true);
</script></body></html>
