<script src="common.js"></script>
<script>
const img = new Image(); img.src = 'banner_livro/fundo_sem_boneco.png';
window.ready = new Promise(r => { img.onload = () => r(true); });
function draw(cfg) {
  const c = document.createElement('canvas'); c.width = 2560; c.height = 1440; document.body.appendChild(c); ctx = c.getContext('2d');
  ctx.drawImage(img, 0, 0);
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, 2560, cfg.clipY); ctx.clip();
  person({ luq: true, x: cfg.x, y: cfg.y, s: cfg.s, expr: 'grin', armR: cfg.arm, thumbR: true });
  ctx.restore();
  return c.toDataURL('image/png');
}
window.exportAll = () => ({ banner_livro: draw(window.CFG) });
window.CFG = { x: 470, y: 1420, s: 1.95, arm: 2.3, clipY: 1010 };
</script></body></html>
